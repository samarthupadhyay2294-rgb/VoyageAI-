services:
  # -------------------------------------------------------------
  # 1. VoyageAI FastAPI Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: voyageai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: OPENROUTESERVICE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync:  AQ.Ab8RN6K5PNRRC4aQdOQxal_kxNI1BIwqiI3a7CLvTf-8OSTCxw
      - key: OPENWEATHER_API_KEY
        sync: 9ef58e936c3f6629938fbb42365afd7
      - key: FOURSQUARE_API_KEY
        sync:  5JYAWJTUGZILMHOWKKJ0NGAOVCEIPMPVBY1FNFTJV0DLHGYR
      - key: UNSPLASH_ACCESS_KEY
        sync: R01r8HGle5zXsS7BmlBF1YBXmLVeV7av5vRNW3seby8
      - key: EXCHANGERATE_API_KEY
        sync: f23ddafa4cd752e293155dd8
      - key: TRAVELPAYOUTS_API_TOKEN
        sync:  877ff3e8ce7ebad0f353b27e4778a3af
      - key: JWT_SECRET_KEY
        generateValue: a6fad8097be2fb32e9d501030e36c16d9912a9a70cd2e530b5e167995dd1a18c

      - key: SUPABASE_URL
        sync: https://iswmdqrggxtuovweqonv.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: sb_publishable_L8GZVe6EAjpHd3JsOQcDiQ_6iAmMgeO
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: sb_secret_ARWWPzuEIfE14egPRZJU6Q_l1P_rQGF

  # -------------------------------------------------------------
  # 2. VoyageAI Frontend SPA Static Site
  # -------------------------------------------------------------
  - type: web
    name: voyageai-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: voyageai-backend
          property: url
