[project]
name = "voyageai-backend"
version = "1.0.0"
description = "VoyageAI Backend - AI Travel Planner"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "sqlalchemy==2.0.25",
    "alembic==1.13.1",
    "redis==5.0.1",
    "slowapi==0.1.9",
    "python-jose[cryptography]==3.3.0",
    "PyJWT==2.8.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.6",
    "httpx==0.25.2",
    "aiohttp==3.9.1",
    "google-generativeai==0.3.2",
    "supabase==2.3.4",
    "psycopg2-binary==2.9.9",
    "reportlab==4.0.8",
    "pillow==10.2.0",
    "python-dotenv==1.0.0",
    "structlog==24.1.0",
    "tenacity==8.2.3",
    "orjson==3.9.12",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "black==24.1.1",
    "ruff==0.1.15",
    "mypy==1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
